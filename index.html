<!DOCTYPE html>
<!--
    Student Enrollment Form using Bootstrap and JsonPowerDB
-->
<html lang="en">

<head>
    <title>Student Enrollment Form - JsonPowerDB</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Student Enrollment Form storing data in SCHOOL-DB / STUDENT-TABLE using JsonPowerDB.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <!-- JPDB Commons Library -->
    <script src="https://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>

    <link rel="stylesheet" href="style.css">

    
</head>

<body>

    <div id="toast" class="alert-toast"></div>

    <div class="container">
        <div class="form-card">
            <h2 class="header-title">
                <span>Student Enrollment Form</span>
            </h2>
            <p class="header-subtitle">Stores data in STUDENT-TABLE relation of SCHOOL-DB database</p>

            <form id="stuForm" method="post" onsubmit="return false;">

                <!-- Roll No (Primary Key) -->
                <div class="form-group">
                    <label for="rollNo">
                        Roll No. :
                        <span id="rollNoMsg"></span>
                    </label>
                    <input type="text"
                        class="form-control"
                        id="rollNo"
                        name="rollNo"
                        placeholder="Enter Roll No. (e.g. 101)"
                        required>
                </div>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName">Full Name :</label>
                    <input type="text"
                        class="form-control"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter Full Name"
                        disabled>
                </div>

                <!-- Class -->
                <div class="form-group">
                    <label for="stuClass">Class :</label>
                    <input type="text"
                        class="form-control"
                        id="stuClass"
                        name="stuClass"
                        placeholder="Enter Class (e.g. 10-A)"
                        disabled>
                </div>

                <!-- Birth Date -->
                <div class="form-group">
                    <label for="birthDate">Birth Date :</label>
                    <input type="date"
                        class="form-control"
                        id="birthDate"
                        name="birthDate"
                        disabled>
                </div>

                <!-- Address -->
                <div class="form-group">
                    <label for="address">Address :</label>
                    <input type="text"
                        class="form-control"
                        id="address"
                        name="address"
                        placeholder="Enter Address"
                        disabled>
                </div>

                <!-- Enrollment Date -->
                <div class="form-group">
                    <label for="enrollmentDate">Enrollment Date :</label>
                    <input type="date"
                        class="form-control"
                        id="enrollmentDate"
                        name="enrollmentDate"
                        disabled>
                </div>

                <!-- Control Buttons -->
                <div class="btn-container">
                    <input type="button"
                        class="btn-custom btn-save"
                        id="save"
                        value="Save"
                        onclick="saveStudent();"
                        disabled>

                    <input type="button"
                        class="btn-custom btn-update"
                        id="update"
                        value="Update"
                        onclick="updateStudent();"
                        disabled>

                    <input type="button"
                        class="btn-custom btn-reset"
                        id="reset"
                        value="Reset"
                        onclick="resetForm();"
                        disabled>
                </div>

            </form>
        </div>
    </div>

</body>
<script src="script.js"></script>
</html>
